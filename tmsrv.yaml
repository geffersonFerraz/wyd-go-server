# Configuração do TMSRV em Go (cmd/tmsrv, flag -config).
#
# É a única fonte de configuração do servidor Go: substitui o serverip.txt,
# o dataserver.txt e o gameconfig.txt do C++ (esses arquivos continuam
# existindo só para o TMsrv.exe em C++).
#
# Todas as chaves são obrigatórias: se faltar alguma, o servidor não inicia e
# diz qual é. Chaves desconhecidas também são erro, para que um erro de
# digitação não passe despercebido. Os comentários "C++:" dizem o valor que o
# servidor original usava.

# Endereços de rede.
network:
  # Onde está o DBSRV (IP do container dbsrv). C++: dataserver.txt.
  dbsrv_ip: 172.30.87.11
  dbsrv_port: 7514

# Lista de servidores do cliente (serverlist.bin). O painel admin gera o
# arquivo a partir daqui: http://<host>/serverlist.bin, ou
# "admin serverlist -o serverlist.bin".
serverlist:
  # Grupo (mundo) no cliente, 1..10: o número do grupo no sn.bin.
  group: 1
  # IP público que os jogadores usam para chegar aos canais. Tem de ser um
  # IPv4: o cliente não resolve nomes.
  public_ip: 192.168.77.191
  # Contagem de online por canal (servNN.htm, servido pela porta pública do
  # painel admin). Até 63 caracteres.
  status_url: http://192.168.77.191/serv00.htm

# Canais: um TMSRV (um container no docker-compose) por canal. Cada TMSRV
# escolhe o seu com -channel N (ou TMSRV_CHANNEL). Substitui o serverip.txt
# do C++ e o data/dbsrv/serverlist.txt do DBSRV.
#   number: numerados 1..N, em ordem e sem buracos (o cliente usa a posição
#           na lista como número do canal). Máximo 10.
#   ip:     IP em que a TMSRV escuta. É também a origem da conexão com o
#           DBSRV, que reconhece o canal por ele, então cada canal tem o seu.
#           No docker-compose, é o IP fixo do container na rede wyd.
#   port:   porta em que a TMSRV escuta e em que os jogadores conectam (o
#           docker-compose publica a mesma porta no host). Na porta 8281 o
#           serverlist.bin leva só o IP (cliente original); nas outras leva
#           "ip:porta", o que exige o cliente com suporte a porta.
channels:
  - { number: 1, ip: 172.30.87.21, port: 8281 }
  - { number: 2, ip: 172.30.87.22, port: 8282 }
  - { number: 3, ip: 172.30.87.23, port: 8283 }
  - { number: 4, ip: 172.30.87.24, port: 8284 }

# Troca de canal dentro do jogo (lista de canais no jogo / comando "srv507").
change_channel:
  # Segundos mínimos entre duas trocas do mesmo jogador.
  cooldown_seconds: 10

# Pasta dos arquivos por conta compartilhados com o C++ (bloqueio de conta,
# recompensa diária). Vazio = a pasta Cache dentro da pasta da TMSRV (-dir).
cache_dir: ""

# Level máximo para entrar na área de novatos.
newbie_zone: 35

# Safiras cobradas pelo Mestre das Habilidades (reset de atributos).
# C++: StatSapphire do gameconfig.txt (30).
stat_sapphire: 30

login:
  # Contas jogando ao mesmo tempo a partir do mesmo computador. C++: 3.
  max_accounts_per_computer: 3

# Missão diária.
missions:
  # Segundos entre uma missão e a próxima (depois de concluir, recusar ou
  # perder a anterior). C++: 1152 (0,32 h).
  offer_every_seconds: 1152
  # Segundos para concluir uma missão aceita. C++: 1152.
  time_to_complete_seconds: 1152

# Lojinha (leilão).
store:
  # A loja aberta dá 1 ponto de honra a cada tantos segundos. C++: 600.
  honor_every_seconds: 600

# Itens, skills, drops e teleportes ficam no Postgres (schema gamedata),
# carregados com o comando gamedata-import. O endereço do banco vem da flag
# -dsn ou da variável DATABASE_URL (não fica neste arquivo).

# Inteligência dos monstros.
mob_ai:
  # A cada quantos segundos um monstro parado anda e procura jogadores.
  # Múltiplos de 0,5. C++: 3.
  idle_think_seconds: 3

  # A cada quantos segundos um monstro em combate age. C++: 2.
  battle_think_seconds: 2

  # true: o monstro procura jogadores mesmo andando longe (mais de 12
  # células) do ponto da rota para onde está indo. C++: false.
  aggro_while_walking: true

  # true: todos os monstros do grupo procuram jogadores, não só o líder.
  # C++: false.
  followers_look_for_players: true

  # Chance mínima (%) de um monstro em combate agir no seu turno. No C++ a
  # chance é só o INT do monstro (a maioria tem entre 50 e 99).
  # 0 = igual ao C++.
  min_attack_chance: 80

