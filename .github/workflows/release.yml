# Release do servidor: ao criar uma tag v* (git tag v1.2.3 && git push origin v1.2.3).
#
# - Binários linux/amd64 (dbsrv, tmsrv, admin, xml-import) anexados à release.
# - Imagens ghcr.io/<dono>/wyd-{dbsrv,tmsrv,admin} com as tags <versão> e latest.
#
# Tags com hífen (v1.2.3-rc1) viram pre-release e não movem a latest.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  binaries:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build linux/amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="wyd-server-${VERSION}-linux-amd64"
          mkdir -p "dist/$name"
          for cmd in dbsrv tmsrv admin xml-import; do
            go build -trimpath -ldflags "-s -w" -o "dist/$name/$cmd" "./cmd/$cmd"
          done
          # Arquivos de configuração que os programas leem por caminho relativo.
          cp -r config tmsrv.yaml README.md .env.example docker-compose.yaml docker-compose.server.yaml "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: server-binaries
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  images:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        cmd: [dbsrv, tmsrv, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/wyd-${{ matrix.cmd }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=wyd-${{ matrix.cmd }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          build-args: CMD=${{ matrix.cmd }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cmd }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cmd }}

  release:
    needs: [binaries, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: server-binaries
          path: dist
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          version="${TAG#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          ## Imagens

          \`\`\`
          docker pull ghcr.io/$owner/wyd-dbsrv:$version
          docker pull ghcr.io/$owner/wyd-tmsrv:$version
          docker pull ghcr.io/$owner/wyd-admin:$version
          \`\`\`

          ## Binários

          \`wyd-server-$TAG-linux-amd64.tar.gz\`: dbsrv, tmsrv, admin e xml-import para Linux amd64, com \`config/\` e \`tmsrv.yaml\`.
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file notes.md --generate-notes $prerelease
