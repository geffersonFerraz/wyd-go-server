<!doctype html>
<!-- Página mostrada dentro do launcher do jogo (área de 598x369). Para trocar a
     arte, ponha a imagem nesta pasta e referencie aqui: o painel embute a pasta
     toda. O navegador do launcher é o controle do IE, então nada de JavaScript
     nem CSS moderno. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>WYD</title>
<style>
html, body { margin: 0; padding: 0; width: 598px; height: 369px; overflow: hidden; background: #050709; }
body { color: #d8dde4; font: 13px Tahoma, Arial, sans-serif; }
.hero { height: 257px; text-align: center; background: #10161d; border-bottom: 1px solid #3a4652; }
.hero h1 { margin: 0; padding-top: 86px; color: #f2d98a; font: bold 42px Georgia, "Times New Roman", serif; letter-spacing: 8px; }
.hero p { margin: 10px 0 0; color: #93a0ad; font-size: 13px; letter-spacing: 1px; }
.news { padding: 14px 20px; }
.news h2 { margin: 0 0 6px; color: #f2d98a; font-size: 13px; }
.news p { margin: 0; line-height: 19px; }
</style>
</head>
<body scroll="no">
<div class="hero">
  <h1>WYD</h1>
  <p>Bem-vindo de volta, aventureiro.</p>
</div>
<div class="news">
  <h2>Novidades</h2>
  <p>Os arquivos do jogo são atualizados automaticamente. Quando a barra terminar, clique em Iniciar.</p>
</div>
</body>
</html>
